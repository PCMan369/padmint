
workflows:
  harkinianpad-ios:
    name: HarkinianPad iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.3

    scripts:
      - name: Verify build environment
        script: |
          xcodebuild -version
          xcrun --version
          df -h "$CM_BUILD_DIR"

      - name: Build HarkinianPad IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/out"
          PADMINT_HOME="$CM_BUILD_DIR/.padmint" python3 scripts/github-build.py harkinianpad --out "$CM_BUILD_DIR/out"

      - name: Verify IPA
        script: |
          find "$CM_BUILD_DIR/out" -name '*.ipa' -print
          test -n "$(find "$CM_BUILD_DIR/out" -name '*.ipa' -print -quit)"

    artifacts:
      - out/*.ipa
