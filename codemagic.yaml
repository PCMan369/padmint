
workflows:
  harkinianpad-ios:
    name: HarkinianPad iOS (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.3

    scripts:
      - name: Verify build environment
        script: |
          xcodebuild -version
          xcrun --version
          df -h "$CM_BUILD_DIR"

      - name: Build HarkinianPad IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/out"
          PADMINT_HOME="$CM_BUILD_DIR/.padmint" python3 scripts/github-build.py harkinianpad --out "$CM_BUILD_DIR/out"

      - name: Verify IPA
        script: |
          find "$CM_BUILD_DIR/out" -name '*.ipa' -print
          test -n "$(find "$CM_BUILD_DIR/out" -name '*.ipa' -print -quit)"

    artifacts:
      - out/*.ipa

  # Stage 0 control build: compiles the PCMan369/harkinianpad fork branch as it
  # is today. It does not use scripts/github-build.py (that script builds the
  # latest published release, never a development branch) and it does not
  # package or sign anything.
  harkinianpad-anchor-stage0:
    name: HarkinianPad Stage 0 baseline (anchor-ios-port, unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      xcode: 26.3
      vars:
        STAGE0_REPO_URL: https://github.com/PCMan369/harkinianpad.git
        STAGE0_BRANCH: anchor-ios-port

    scripts:
      - name: Verify build environment
        script: |
          set -euo pipefail
          xcodebuild -version
          xcrun --version
          git --version
          python3 --version
          # Shipwright soh/CMakeLists.txt requires cmake_minimum_required 3.26.0.
          min_cmake=3.26.0
          cmake_ok() {
            command -v cmake >/dev/null &&
              [ "$(printf '%s\n%s\n' "$min_cmake" "$(cmake --version | awk 'NR==1{print $3}')" | sort -V | head -n1)" = "$min_cmake" ]
          }
          if ! cmake_ok; then
            if brew list --formula cmake >/dev/null 2>&1; then brew upgrade cmake; else brew install cmake; fi
            export PATH="$(brew --prefix)/bin:$PATH"
            hash -r
          fi
          cmake_ok || { echo "CMake >= $min_cmake required, found: $(command -v cmake || echo none)" >&2; exit 1; }
          # Persist the verified cmake's directory first on PATH for later steps.
          echo "PATH=$(dirname "$(command -v cmake)"):$PATH" >> "$CM_ENV"
          command -v cmake
          cmake --version
          df -h "$CM_BUILD_DIR"

      - name: Check out fork branch
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/logs" "$CM_BUILD_DIR/stage0-out"
          rm -rf "$CM_BUILD_DIR/harkinianpad-src"
          git clone --branch "$STAGE0_BRANCH" --single-branch --no-tags \
            "$STAGE0_REPO_URL" "$CM_BUILD_DIR/harkinianpad-src"
          cd "$CM_BUILD_DIR/harkinianpad-src"
          test "$(git remote get-url origin)" = "$STAGE0_REPO_URL"
          test "$(git symbolic-ref --short HEAD)" = "$STAGE0_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$STAGE0_BRANCH")"
          test -z "$(git status --porcelain --untracked-files=normal)"

      - name: Record build identity
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/harkinianpad-src"
          {
            echo "stage: 0 baseline (no Anchor changes)"
            echo "repository: $(git remote get-url origin)"
            echo "branch: $(git symbolic-ref --short HEAD)"
            echo "commit: $(git rev-parse HEAD)"
            git log -1 --format='subject: %s%ncommit_date: %cI'
            echo "sources.lock.json sha256: $(shasum -a 256 sources.lock.json | cut -d' ' -f1)"
            python3 -c 'import json; [print("pin: %s %s" % (c["name"], c["commit"])) for c in json.load(open("sources.lock.json"))["components"]]'
            echo "codemagic_build_id: ${CM_BUILD_ID:-unset}"
            echo "padmint_commit: ${CM_COMMIT:-unset}"
          } | tee "$CM_BUILD_DIR/logs/stage0-identity.txt"

      - name: Repository safety check
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/harkinianpad-src"
          scripts/check-repo-safety.sh 2>&1 | tee "$CM_BUILD_DIR/logs/check-repo-safety.log"

      - name: Build unsigned device app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/harkinianpad-src"
          scripts/build-ios.sh --device 2>&1 | tee "$CM_BUILD_DIR/logs/build-ios.log"

      - name: Collect app and verify
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/harkinianpad-src"
          rel=build-ios-soh/soh/Release-iphoneos
          test -d "$rel/HarkinianPad.app"
          test -f "$rel/HarkinianPad.build.json"
          cp "$rel/HarkinianPad.build.json" "$CM_BUILD_DIR/stage0-out/"
          ditto -c -k --keepParent "$rel/HarkinianPad.app" "$CM_BUILD_DIR/stage0-out/HarkinianPad-stage0-device.app.zip"
          lipo -info "$rel/HarkinianPad.app/HarkinianPad"
          echo "built commit: $(git rev-parse HEAD)"
          python3 -c 'import json; r=json.load(open("'"$rel"'/HarkinianPad.build.json")); print("provenance wrapper:", r["wrapper"])'
          ls -l "$CM_BUILD_DIR/stage0-out"

    artifacts:
      - logs/*
      - stage0-out/*

  # Lightweight probe for the macOS-SDK BZip2/ZLIB link failure seen in
  # harkinianpad-anchor-stage0. Configures a throwaway project (no dependency
  # fetch, no app compile or link) with configure-ios.sh's toolchain flags and
  # records how ZLIB and BZip2 are found. Independent of the full diagnostic.
  harkinianpad-cmake-probe:
    name: HarkinianPad CMake find probe (ZLIB, BZip2)
    instance_type: mac_mini_m2
    max_build_duration: 10

    environment:
      xcode: 26.3
      vars:
        STAGE0_REPO_URL: https://github.com/PCMan369/harkinianpad.git
        STAGE0_BRANCH: anchor-ios-port

    scripts:
      - name: Check out fork branch
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/logs" "$CM_BUILD_DIR/diagnostics"
          rm -rf "$CM_BUILD_DIR/harkinianpad-src"
          git clone --branch "$STAGE0_BRANCH" --single-branch --no-tags \
            "$STAGE0_REPO_URL" "$CM_BUILD_DIR/harkinianpad-src"
          cd "$CM_BUILD_DIR/harkinianpad-src"
          test "$(git remote get-url origin)" = "$STAGE0_REPO_URL"
          test "$(git symbolic-ref --short HEAD)" = "$STAGE0_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$STAGE0_BRANCH")"
          echo "repository: $(git remote get-url origin)" | tee "$CM_BUILD_DIR/diagnostics/identity.txt"
          echo "branch: $STAGE0_BRANCH" | tee -a "$CM_BUILD_DIR/diagnostics/identity.txt"
          echo "commit: $(git rev-parse HEAD)" | tee -a "$CM_BUILD_DIR/diagnostics/identity.txt"

      - name: Record toolchain and environment
        script: |
          set -uo pipefail
          {
            echo "== cmake"; command -v cmake; cmake --version
            echo "== xcode"; xcode-select -p; xcodebuild -version
            echo "== sdk paths"
            echo "iphoneos: $(xcrun --sdk iphoneos --show-sdk-path)"
            echo "macosx:   $(xcrun --sdk macosx --show-sdk-path)"
            echo "== environment (allowlist)"
            env | grep -E '^(SDKROOT|DEVELOPER_DIR|MACOSX_DEPLOYMENT_TARGET|IPHONEOS_DEPLOYMENT_TARGET|DEPLOYMENT_TARGET|CMAKE_[A-Z_]*|CC|CXX|CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|PKG_CONFIG[A-Z_]*|HOMEBREW_PREFIX|BUNDLE_ID|DEVELOPMENT_TEAM|PATH)=' | sort
            echo "== libbz2 / libz stubs per SDK"
            for sdk in iphoneos macosx; do
              p="$(xcrun --sdk $sdk --show-sdk-path)"
              for lib in libbz2 libz; do
                f="$p/usr/lib/$lib.tbd"
                echo "--- $f"; ls -l "$f" 2>&1
                grep -m3 -E '^(targets:|install-name:)' "$f" 2>&1
              done
            done
          } > "$CM_BUILD_DIR/diagnostics/environment.txt" 2>&1
          cat "$CM_BUILD_DIR/diagnostics/environment.txt"

      - name: CMake find probe (ZLIB, BZip2)
        script: |
          set -uo pipefail
          D="$CM_BUILD_DIR/diagnostics"
          P="$CM_BUILD_DIR/probe"
          rm -rf "$P"; mkdir -p "$P/src"
          # The probe repeats the toolchain flags of scripts/configure-ios.sh.
          # Fail loudly if the script no longer contains them.
          for flag in -GXcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 \
                      -DCMAKE_BUILD_TYPE:STRING=Release -DENABLE_SCRIPTING=OFF \
                      -DCMAKE_OSX_DEPLOYMENT_TARGET= -DCMAKE_SYSTEM_VERSION= -DPLATFORM=; do
            grep -qF -- "$flag" "$CM_BUILD_DIR/harkinianpad-src/scripts/configure-ios.sh" \
              || { echo "configure-ios.sh no longer contains $flag; update the probe" | tee "$D/probe-error.txt" >&2; echo 2 > "$D/probe.exit"; exit 0; }
          done
          cat > "$P/src/CMakeLists.txt" <<'CMAKE'
          cmake_minimum_required(VERSION 3.26.0)
          # Mirrors the order in Shipwright CMakeLists.txt: system version and
          # deployment target are set before project(); ZLIB is found before
          # OBJCXX is enabled, BZip2 after (as StormLib does).
          if(CMAKE_SYSTEM_NAME STREQUAL "iOS")
              set(CMAKE_SYSTEM_VERSION "${DEPLOYMENT_TARGET}" CACHE STRING "" FORCE)
          endif()
          set(CMAKE_OSX_DEPLOYMENT_TARGET "10.15" CACHE STRING "Minimum OS X deployment version")
          project(ConfigureProbe LANGUAGES C CXX)
          function(probe_dump)
              foreach(v ${ARGN})
                  message(STATUS "probe: ${v} = ${${v}}")
              endforeach()
          endfunction()
          probe_dump(CMAKE_VERSION CMAKE_GENERATOR CMAKE_SYSTEM_NAME CMAKE_OSX_SYSROOT
                     _CMAKE_OSX_SYSROOT_PATH CMAKE_OSX_DEPLOYMENT_TARGET
                     CMAKE_FIND_ROOT_PATH CMAKE_FIND_ROOT_PATH_MODE_LIBRARY
                     CMAKE_FIND_ROOT_PATH_MODE_INCLUDE CMAKE_FIND_ROOT_PATH_MODE_PACKAGE
                     CMAKE_PREFIX_PATH CMAKE_SYSTEM_PREFIX_PATH
                     CMAKE_PLATFORM_IMPLICIT_LINK_DIRECTORIES)
          find_package(ZLIB)
          enable_language(OBJCXX)
          find_package(BZip2)
          probe_dump(ZLIB_FOUND ZLIB_LIBRARIES ZLIB_INCLUDE_DIRS BZIP2_FOUND BZIP2_LIBRARIES
                     BZIP2_INCLUDE_DIR)
          CMAKE
          DT="${DEPLOYMENT_TARGET:-15.0}"
          cmake -Wno-unused-cli -S "$P/src" -B "$P/build" \
            -GXcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION="$DT" \
            -DDEPLOYMENT_TARGET="$DT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DENABLE_SCRIPTING=OFF \
            -DPLATFORM="${IOS_PLATFORM:-OS64COMBINED}" \
            --debug-find-pkg=ZLIB,BZip2 2>&1 | tee "$D/probe-debug-find.log"
          rc="${PIPESTATUS[0]}"
          echo "$rc" > "$D/probe.exit"
          cp "$P/build/CMakeCache.txt" "$D/probe-CMakeCache.txt" 2>/dev/null || true
          exit 0

      - name: CMake find probe, sanitized environment
        script: |
          set -uo pipefail
          D="$CM_BUILD_DIR/diagnostics"
          P="$CM_BUILD_DIR/probe"
          # Same project and flags as the probe above (it wrote $P/src), but without the
          # inherited SDKROOT, CPATH and LIBRARY_PATH, as padmint/cli.py does for device builds.
          if [ ! -f "$P/src/CMakeLists.txt" ]; then
            echo "probe project missing; the previous step stopped early" | tee "$D/probe-sanitized-error.txt" >&2
            echo 2 > "$D/probe-sanitized.exit"; exit 0
          fi
          for var in SDKROOT CPATH LIBRARY_PATH; do
            if value="$(printenv "$var")"; then echo "Inherited $var=$value (removed for this probe)" | tee -a "$D/probe-sanitized-env.txt"; fi
          done
          rm -rf "$P/build-sanitized"
          DT="${DEPLOYMENT_TARGET:-15.0}"
          env -u SDKROOT -u CPATH -u LIBRARY_PATH \
            cmake -Wno-unused-cli -S "$P/src" -B "$P/build-sanitized" \
            -GXcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_VERSION="$DT" \
            -DDEPLOYMENT_TARGET="$DT" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$DT" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DENABLE_SCRIPTING=OFF \
            -DPLATFORM="${IOS_PLATFORM:-OS64COMBINED}" \
            --debug-find-pkg=ZLIB,BZip2 2>&1 | tee "$D/probe-sanitized-debug-find.log"
          echo "${PIPESTATUS[0]}" > "$D/probe-sanitized.exit"
          cp "$P/build-sanitized/CMakeCache.txt" "$D/probe-sanitized-CMakeCache.txt" 2>/dev/null || true
          exit 0

      - name: Report probe result
        script: |
          set -uo pipefail
          D="$CM_BUILD_DIR/diagnostics"
          classify() {
            line="$(grep -m1 "^-- Found $3:" "$1" 2>/dev/null || true)"
            case "$line" in
              "") sdk="not found" ;;
              *MacOSX*) sdk="macOS SDK" ;;
              *iPhoneOS*) sdk="iPhoneOS SDK" ;;
              *iPhoneSimulator*) sdk="iPhoneSimulator SDK" ;;
              *) sdk="other: $line" ;;
            esac
            printf '%-22s %-6s -> %s\n' "$2" "$3" "$sdk"
          }
          {
            echo "Which SDK did each library resolve to?"
            classify "$D/probe-debug-find.log" "inherited environment" ZLIB
            classify "$D/probe-debug-find.log" "inherited environment" BZip2
            classify "$D/probe-sanitized-debug-find.log" "sanitized environment" ZLIB
            classify "$D/probe-sanitized-debug-find.log" "sanitized environment" BZip2
            echo
            echo "CMAKE_OSX_SYSROOT reported by each probe:"
            echo "inherited:  $(grep -m1 'probe: CMAKE_OSX_SYSROOT' "$D/probe-debug-find.log" 2>/dev/null)"
            echo "sanitized:  $(grep -m1 'probe: CMAKE_OSX_SYSROOT' "$D/probe-sanitized-debug-find.log" 2>/dev/null)"
          } | tee "$D/probe-summary.txt"
          rc1="$(cat "$D/probe.exit" 2>/dev/null || echo unknown)"
          rc2="$(cat "$D/probe-sanitized.exit" 2>/dev/null || echo unknown)"
          echo "probe exit status: $rc1" | tee -a "$D/identity.txt"
          echo "sanitized probe exit status: $rc2" | tee -a "$D/identity.txt"
          ls -l "$D"
          [ "$rc1" = "0" ] && [ "$rc2" = "0" ]

    artifacts:
      - diagnostics/*

  # Full configure-only diagnostic: fetches the pinned sources, runs the real
  # configure-ios.sh --soh and collects CMake's own files. Run it only if the
  # probe (harkinianpad-cmake-probe) is not conclusive. It never compiles,
  # links, packages or signs the app.
  harkinianpad-cmake-diagnostic:
    name: HarkinianPad CMake full configure diagnostic (no compile)
    instance_type: mac_mini_m2
    max_build_duration: 20

    environment:
      xcode: 26.3
      vars:
        STAGE0_REPO_URL: https://github.com/PCMan369/harkinianpad.git
        STAGE0_BRANCH: anchor-ios-port

    scripts:
      - name: Check out fork branch
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/logs" "$CM_BUILD_DIR/diagnostics"
          rm -rf "$CM_BUILD_DIR/harkinianpad-src"
          git clone --branch "$STAGE0_BRANCH" --single-branch --no-tags \
            "$STAGE0_REPO_URL" "$CM_BUILD_DIR/harkinianpad-src"
          cd "$CM_BUILD_DIR/harkinianpad-src"
          test "$(git remote get-url origin)" = "$STAGE0_REPO_URL"
          test "$(git symbolic-ref --short HEAD)" = "$STAGE0_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/remotes/origin/$STAGE0_BRANCH")"
          echo "repository: $(git remote get-url origin)" | tee "$CM_BUILD_DIR/diagnostics/identity.txt"
          echo "branch: $STAGE0_BRANCH" | tee -a "$CM_BUILD_DIR/diagnostics/identity.txt"
          echo "commit: $(git rev-parse HEAD)" | tee -a "$CM_BUILD_DIR/diagnostics/identity.txt"

      - name: Record toolchain and environment
        script: |
          set -uo pipefail
          {
            echo "== cmake"; command -v cmake; cmake --version
            echo "== xcode"; xcode-select -p; xcodebuild -version
            echo "== sdk paths"
            echo "iphoneos: $(xcrun --sdk iphoneos --show-sdk-path)"
            echo "macosx:   $(xcrun --sdk macosx --show-sdk-path)"
            echo "== environment (allowlist)"
            env | grep -E '^(SDKROOT|DEVELOPER_DIR|MACOSX_DEPLOYMENT_TARGET|IPHONEOS_DEPLOYMENT_TARGET|DEPLOYMENT_TARGET|CMAKE_[A-Z_]*|CC|CXX|CFLAGS|CXXFLAGS|CPPFLAGS|LDFLAGS|PKG_CONFIG[A-Z_]*|HOMEBREW_PREFIX|BUNDLE_ID|DEVELOPMENT_TEAM|PATH)=' | sort
            echo "== libbz2 / libz stubs per SDK"
            for sdk in iphoneos macosx; do
              p="$(xcrun --sdk $sdk --show-sdk-path)"
              for lib in libbz2 libz; do
                f="$p/usr/lib/$lib.tbd"
                echo "--- $f"; ls -l "$f" 2>&1
                grep -m3 -E '^(targets:|install-name:)' "$f" 2>&1
              done
            done
          } > "$CM_BUILD_DIR/diagnostics/environment.txt" 2>&1
          cat "$CM_BUILD_DIR/diagnostics/environment.txt"

      - name: Fetch pinned sources and port archive
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/harkinianpad-src"
          { scripts/clone-sources.sh && scripts/verify-sources.py && scripts/generate-port-archive.sh; } 2>&1 | tee "$CM_BUILD_DIR/logs/prepare-sources.log"

      - name: Configure only (iOS device, no compile)
        script: |
          set +e
          cd "$CM_BUILD_DIR/harkinianpad-src"
          scripts/configure-ios.sh --soh 2>&1 | tee "$CM_BUILD_DIR/logs/configure-ios.log"
          echo "${PIPESTATUS[0]}" > "$CM_BUILD_DIR/diagnostics/configure.exit"
          exit 0

      - name: Collect CMake diagnostics
        script: |
          set -uo pipefail
          B="$CM_BUILD_DIR/harkinianpad-src/build-ios-soh"
          D="$CM_BUILD_DIR/diagnostics"
          for f in CMakeCache.txt CMakeFiles/CMakeConfigureLog.yaml; do
            if [ -f "$B/$f" ]; then cp "$B/$f" "$D/"; else echo "missing: $f" | tee -a "$D/missing.txt"; fi
          done
          for f in CMakeSystem.cmake CMakeCXXCompiler.cmake; do
            p="$(find "$B/CMakeFiles" -maxdepth 2 -name "$f" 2>/dev/null | head -n1)"
            if [ -n "$p" ]; then cp "$p" "$D/"; else echo "missing: $f" | tee -a "$D/missing.txt"; fi
          done
          rc="$(cat "$D/configure.exit" 2>/dev/null || echo unknown)"
          echo "configure exit status: $rc" | tee -a "$D/identity.txt"
          ls -l "$D"
          [ "$rc" = "0" ]

    artifacts:
      - diagnostics/*
      - logs/*
